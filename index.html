<!DOCTYPE html>
<html>
<head>
    <title>MyShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>MyShop</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="user.html">User</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <section class="banner">
        <h1>Welcome to MyShop</h1>
        <p>Find your favourite products at the best prices.</p>
        <a href="#products" class="btn">Shop Now</a>
    </section>

    <h2 class="title" id="products">Our Products</h2>

    <div class="products">
        <div class="card">
            <img src="https://placehold.co/200x150?text=Headphones">
            <h3>Headphones</h3>
            <p>₹999</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/200x150?text=Watch">
            <h3>Smart Watch</h3>
            <p>₹1499</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/200x150?text=Shoes">
            <h3>Shoes</h3>
            <p>₹1999</p>
            <button>Add to Cart</button>
        </div>
    </div>

    <footer>© 2026 MyShop | Online Shopping Website</footer>

</body>
</html>
